<!-- Login Container -->
<main class="relative z-20 w-full max-w-md px-margin-mobile md:px-0">
<div class="bg-surface-container-lowest rounded-lg shadow-ambient-lvl2 p-8 md:p-12 flex flex-col gap-8 w-full border border-outline-variant/30">

<div class="flex flex-col items-center text-center space-y-4">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                        local_library
                    </span>
</div>
<div>
<h1 class="font-headline-sm text-headline-sm text-primary">International Pastors Management Ministry</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-1">Admin Portal</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            mail
                        </span>
<input class="w-full pl-10 pr-4 py-3 rounded-DEFAULT border border-outline-variant bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="admin@agapeinstitute.edu" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            lock
                        </span>
<input class="w-full pl-10 pr-10 py-3 rounded-DEFAULT border border-outline-variant bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">
                                visibility
                            </span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-primary focus:ring-primary cursor-pointer" type="checkbox">
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-variant transition-colors underline-offset-4 hover:underline" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Submit Action -->
<button class="w-full mt-2 py-3.5 rounded-DEFAULT bg-secondary-fixed-dim text-on-secondary-fixed font-label-md text-label-md font-bold text-center tracking-wide hover:-translate-y-0.5 hover:shadow-ambient-lvl2 transition-all duration-200" type="submit">

                </button>
</form>
